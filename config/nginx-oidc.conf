user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    # Query strings can contain OIDC codes; never write them to access logs.
    log_format safe '$remote_addr $request_method $uri $status';
    access_log /dev/stdout safe;
    server_tokens off;
    map $http_upgrade $connection_upgrade { default upgrade; '' close; }
    server {
        listen 8443 ssl;
        listen [::]:8443 ssl;
        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # Gateway enforces the configured upload limit while streaming the body.
        client_max_body_size 0;
        location / {
            proxy_pass http://127.0.0.1:8084;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-Proto https;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 86400s;
        }
    }
}
