user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Browser requests must originate from the same HTTPS host and port.
    # Clients without an Origin header still require the normal login.
    map $http_origin $expected_origin {
        "" "";
        default "$scheme://$http_host";
    }

    server {
        listen 8443 ssl default_server;
        listen [::]:8443 ssl default_server;
        server_name _;
        if ($http_origin != $expected_origin) { return 403; }
        add_header Content-Security-Policy "frame-ancestors 'self'" always;
        add_header X-Content-Type-Options nosniff always;

        ssl_certificate /etc/nginx/ssl/nginx.crt;
        ssl_certificate_key /etc/nginx/ssl/nginx.key;

        # Optional Authentication Include
        include /etc/nginx/conf.d/auth.conf*;

        # Selkies Dashboard Static Web Client
        location / {
            root /usr/share/selkies/web;
            index index.html index.htm;
            try_files $uri $uri/ =404;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "no-cache, must-revalidate" always;
        }

        # Immutable Caching for Vite Content-Hashed Assets
        location ^~ /assets/ {
            root /usr/share/selkies/web;
            add_header Content-Security-Policy "frame-ancestors 'self'" always;
            add_header X-Content-Type-Options nosniff always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Selkies Streaming API & WebSocket Endpoints (/api/websockets, /api/tokens, /api/ws, /api/turn, etc.)
        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8082/api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Legacy / Alias WebSocket Endpoints
        location = /websockets {
            proxy_pass http://127.0.0.1:8082/api/websockets;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        location = /websocket {
            proxy_pass http://127.0.0.1:8082/api/websockets;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }
    }
}
