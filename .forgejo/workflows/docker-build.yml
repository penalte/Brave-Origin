name: Build, test, and publish
on:
  push:
    branches: [x11, x11-beta]
    tags: ['x11-v*']
  pull_request:
    branches: [x11, x11-beta]
  workflow_dispatch:
concurrency:
  group: brave-origin-${{ github.ref }}
  cancel-in-progress: false
jobs:
  image:
    # Pull requests must never execute untrusted code on the publishing runner.
    if: github.event_name != 'pull_request'
    runs-on: docker-build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate configuration
        run: bash scripts/check.sh
      - name: Build
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
        run: |
          set -eu
          version=dev
          case "$BUILD_REF" in refs/tags/x11-v*) version=${BUILD_REF#refs/tags/x11-v}-x11 ;; refs/heads/x11-beta) version=x11-beta ;; esac
          docker build --build-arg "BUILD_COMMIT=$BUILD_SHA" --build-arg "VERSION=$version" -t "brave-origin:ci-$BUILD_SHA" .
      - name: Test container
        env:
          BUILD_SHA: ${{ github.sha }}
        run: bash scripts/smoke-test.sh "brave-origin:ci-$BUILD_SHA"
      - name: Publish both registries
        env:
          BUILD_SHA: ${{ github.sha }}
          BUILD_REF: ${{ github.ref }}
          REGISTRY_IMAGE: ${{ secrets.REGISTRY_IMAGE }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
        run: bash scripts/publish-images.sh "brave-origin:ci-$BUILD_SHA" "$BUILD_REF" "$BUILD_SHA"
      - name: Remove temporary image
        if: always()
        env:
          BUILD_SHA: ${{ github.sha }}
        run: docker image rm "brave-origin:ci-$BUILD_SHA" || true
