# ==============================================================================
# Optional Docker Compose Override: NVIDIA GPU Hardware Acceleration
# ==============================================================================
# Requires the NVIDIA Container Toolkit on the host.
#
#   docker compose -f compose.yaml -f compose.nvidia.yaml up -d
#
# The image already requests every driver capability. Supplying only compute
# support leaves Selkies encoding on the GPU while the browser has no EGL
# driver to render with, so do not narrow NVIDIA_DRIVER_CAPABILITIES here.
# ==============================================================================

services:
  brave-origin:
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, compute, utility, graphics, display, video]
